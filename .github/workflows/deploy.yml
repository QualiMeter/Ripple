name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate production configuration
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          test -n "$VITE_API_URL"

      - name: Build
        env:
          VITE_API_MODE: http
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"

      - name: Add server to known_hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p /var/www/ripple/frontend && rm -rf /var/www/ripple/frontend/*"

          tar -C dist -cf - . | ssh "$SERVER_USER@$SERVER_HOST" \
            "tar -C /var/www/ripple/frontend -xf -"

          ssh "$SERVER_USER@$SERVER_HOST" \
            "test -f /var/www/ripple/frontend/index.html"
